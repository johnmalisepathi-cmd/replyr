name: Weekly content draft

on:
  schedule:
    # Every Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: content-agent
        run: npm install

      - name: Generate draft
        working-directory: content-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Open PR with the new draft
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Add weekly content draft'
          branch: content-agent/weekly-draft
          delete-branch: true
          title: 'Weekly content draft ready for review'
          body: |
            A new draft was generated by the content agent. Review it in
            `content-agent/drafts/`, edit as needed, fill in the affiliate
            link placeholders, then merge and publish it to your newsletter.
